# ============================================================================
# Supabase config — SIGO Obras
# ============================================================================
# https://supabase.com/docs/guides/cli/config
# Aplicado APENAS para o ambiente local (supabase start).
# Configurações do projeto hosted são feitas pelo Dashboard.
# ============================================================================

project_id = "sigoobras"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://sigoobras.com.br",
  "https://www.sigoobras.com.br",
  "http://localhost:5173",
  "http://localhost:4173"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # vamos usar convite customizado, não confirm padrão
secure_password_change = true
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

# ============================================================================
# Edge Functions — verify_jwt de CADA função declarado aqui.
# Diferente do resto deste arquivo, estes blocos valem também no deploy para o
# projeto hosted. Com todos declarados, um deploy feito sem a flag
# --no-verify-jwt (ou de todas as funções de uma vez) não muda o comportamento
# de nenhuma. Função nova: acrescente o bloco dela.
#   false = o gateway não exige JWT; a função confere a identidade por dentro
#           (JWT do SIGO, token do portal, link ou segredo).
#   true  = o gateway exige JWT antes de a função rodar.
# ============================================================================

# Conector do Claude (MCP): o Claude manda chave opaca do SIGO, não JWT do
# Supabase — o gateway não pode exigir JWT. Deploy também com --no-verify-jwt.
[functions.mcp]
verify_jwt = false

[functions.mcp-oauth]
verify_jwt = false

# Portal de Treinamento (EAD). O valor fica escrito aqui, e não só na flag do deploy, para que um deploy feito
# sem a flag (por exemplo, o de todas as funções) não troque o comportamento de nenhuma destas três.
#   portal-funcionario:  o aluno entra com usuário e senha do portal (token próprio), sem JWT do Supabase.
#   funcionario-acesso:  o RH chama com a sessão do SIGO e a função confere o vínculo e a permissão por dentro
#                        (não é o gateway que valida). Deploy com --no-verify-jwt.
#   validar-certificado: consulta PÚBLICA de autenticidade, chamada com a chave anônima (que é um JWT): o
#                        gateway exige JWT, então o deploy vai SEM --no-verify-jwt.
[functions.portal-funcionario]
verify_jwt = false

[functions.funcionario-acesso]
verify_jwt = false

[functions.validar-certificado]
verify_jwt = true

# Lembretes de habilitação por WhatsApp: chamada pelo pg_cron (pg_net), sem JWT. A função não aceita
# entrada: só esvazia a fila que o banco gravou. Deploy com --no-verify-jwt.
[functions.habilitacao-lembretes]
verify_jwt = false

# Login, senha e troca de empresa: chamadas antes de existir sessão, ou com o
# JWT do SIGO conferido dentro da função (getCallerFromJWT).
[functions.login-custom]
verify_jwt = false

[functions.alterar-senha]
verify_jwt = false

[functions.recuperar-senha]
verify_jwt = false

[functions.redefinir-senha-codigo]
verify_jwt = false

[functions.redefinir-senha-admin]
verify_jwt = false

[functions.trocar-empresa]
verify_jwt = false

# Portais do cliente e do fornecedor: entram com link ou token do portal, sem
# sessão do Supabase.
[functions.portal-cliente-dados]
verify_jwt = false

[functions.portal-cliente-acao]
verify_jwt = false

[functions.portal-fornecedor-login]
verify_jwt = false

[functions.portal-fornecedor-cotacoes]
verify_jwt = false

[functions.portal-fornecedor-cotacao]
verify_jwt = false

# Orçamento (PDF/foto) anexado pelo fornecedor no link da cotação e lido pela IA:
# credencial = token da participação, como as irmãs. Deploy com --no-verify-jwt.
[functions.portal-fornecedor-orcamento]
verify_jwt = false

[functions.portal-fornecedor-resposta]
verify_jwt = false

# Senha do portal e links das cotações, pedidos pela tela de Compras: JWT do SIGO
# conferido por dentro (usuarioDaRequisicao), como o funcionario-acesso.
# Deploy com --no-verify-jwt.
[functions.fornecedor-acesso]
verify_jwt = false

# Recibo do fornecedor: a equipe chama com JWT (conferido por dentro) e o
# fornecedor abre o recibo por link com token.
[functions.recibo-fornecedor]
verify_jwt = false

# WhatsApp pelo canal do SaaS: JWT do SIGO conferido por dentro.
[functions.enviar-whatsapp]
verify_jwt = false

# Ponte do Agente de Licitações: sem JWT; a porta é o secret VINCULAR_PASTA_SECRET
# (sem ele a função responde 503 para todos).
[functions.vincular-pasta-oportunidade]
verify_jwt = false

# IA e configuração do SaaS: o gateway exige JWT. Deploy SEM --no-verify-jwt.
[functions.ia-processar]
verify_jwt = true

[functions.saas-config]
verify_jwt = true
