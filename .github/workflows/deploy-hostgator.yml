name: Deploy frontend to Hostgator

# Quando dispara:
#   - push em master tocando apps/web/** (build do site)
#   - dispatch manual no Actions UI (botão "Run workflow")
# Em qualquer dos dois, o site só é publicado depois que o workflow "CI" do MESMO
# commit termina verde (job aguardar-ci). CI vermelho, cancelado ou ausente = sem deploy.
on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "shared/sdk/**"
      - ".github/workflows/deploy-hostgator.yml"
  workflow_dispatch:

# O token do workflow só lê o código e o resultado do CI; nada aqui escreve no repositório.
permissions:
  contents: read
  actions: read

# Cancela builds antigos se nova mudança chega
concurrency:
  group: deploy-hostgator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Espera o CI deste commit. Sem isto, um push com teste quebrado ia ao ar do
  # mesmo jeito, porque o deploy e o CI disparavam em paralelo, sem relação.
  # ---------------------------------------------------------------------------
  aguardar-ci:
    name: Esperar o CI deste commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Esperar o workflow CI terminar verde
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Commit: $GITHUB_SHA"
          status=""
          conclusao=""
          url=""
          # 80 voltas de 15 s = 20 min (o CI inteiro leva bem menos que isso)
          for volta in $(seq 1 80); do
            dados=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --limit 1 --json status,conclusion,url \
              --jq '.[0] // empty | [.status, (.conclusion // "-"), .url] | @tsv' || true)
            if [ -z "$dados" ]; then
              echo "CI deste commit ainda não apareceu (volta $volta)"
            else
              IFS=$'\t' read -r status conclusao url <<< "$dados"
              echo "CI: $status / $conclusao (volta $volta)"
              if [ "$status" = "completed" ]; then break; fi
            fi
            sleep 15
          done
          if [ "$status" != "completed" ]; then
            echo "::error::O CI deste commit não terminou em 20 minutos. Deploy cancelado."
            exit 1
          fi
          if [ "$conclusao" != "success" ]; then
            echo "::error::O CI terminou como '$conclusao'. Deploy cancelado. $url"
            exit 1
          fi
          echo "::notice::CI verde. Seguindo para o deploy."

  build-and-deploy:
    needs: aguardar-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install all workspaces
        run: npm ci

      - name: Build Vite (production)
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LEGACY_APP_ID: ${{ secrets.VITE_LEGACY_APP_ID }}
          VITE_LEGACY_APP_BASE_URL: ${{ secrets.VITE_LEGACY_APP_BASE_URL }}
          VITE_APP_BASE_URL: https://www.sigoobras.com.br
          VITE_APP_NAME: SIGO Obras
          VITE_DATA_BACKEND: supabase
        run: npm run build

      - name: Verify build artifacts
        run: |
          ls -la apps/web/dist
          test -f apps/web/dist/index.html || (echo "::error::dist/index.html ausente"; exit 1)
          test -f apps/web/dist/.htaccess || (echo "::error::dist/.htaccess ausente (esqueceu public/.htaccess?)"; exit 1)
          test -f apps/web/dist/.well-known/oauth-authorization-server

      # Deploy via lftp — ferramenta nativa Linux, controle preciso de paths.
      # Substituiu o SamKirkland/FTP-Deploy-Action que tinha bug criando
      # diretório "C:/" no servidor mesmo em chroot limpo.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp (mirror)
        env:
          FTP_HOST: ${{ secrets.HOSTGATOR_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTGATOR_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTGATOR_FTP_PASS }}
          # FTP_DIR é o destino remoto. Geralmente "/" pra chroot do FTP user
          # já ser a pasta do site. Se precisar de subdiretório, ajuste o secret.
          FTP_DIR: ${{ secrets.HOSTGATOR_FTP_DIR }}
        run: |
          cd apps/web/dist
          echo "Arquivos a enviar:"
          find . -type f | wc -l

          # IMPORTANTE: usamos `mirror ./ /` direto SEM `cd` antes.
          # O FTP user (cPanel) já está chrootado na pasta do site, então
          # `/` aqui = raiz do site. Tentar `cd` em algum subdiretório
          # pode entrar na pasta lixo "C:/" que sobrou de deploys antigos.
          #
          # FTPS obrigatório (FTP sobre TLS, porta 21): `ssl-force` recusa a conexão
          # se o servidor não negociar TLS, então a senha nunca sai em texto puro;
          # `ssl-protect-data` cifra também os arquivos; o certificado é conferido
          # contra as autoridades do sistema e contra o nome do servidor.
          # Se falhar com "Certificate verification", o secret HOSTGATOR_FTP_HOST
          # não bate com o nome do certificado: use o nome do servidor que o cPanel
          # mostra em "Contas de FTP → Configurar cliente FTP" (não um IP).
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname yes;
            set ssl:ca-file /etc/ssl/certs/ca-certificates.crt;
            set net:max-retries 3;
            set net:timeout 30;
            open -u '$FTP_USER','$FTP_PASS' 'ftp://$FTP_HOST';
            pwd;
            mirror \
              --reverse \
              --delete \
              --verbose \
              --exclude-glob '.well-known/' \
              --exclude-glob '.well-known/**' \
              --exclude-glob 'sigoobras-deploy-*.zip' \
              --exclude-glob 'C:/' \
              --exclude-glob 'C:/**' \
              ./ /;
            mkdir -pf /.well-known;
            put -O /.well-known .well-known/oauth-authorization-server;
            bye;
          "
          echo "::notice::✅ Deploy concluído via lftp"

      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice::Site: https://www.sigoobras.com.br"
          else
            echo "::error::Deploy falhou — ver logs acima"
            echo "::error::Erro de certificado no FTPS? Confira o secret HOSTGATOR_FTP_HOST (nome do servidor, não IP)."
          fi
